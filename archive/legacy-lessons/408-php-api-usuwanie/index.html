<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP API — usuwanie oferty</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <p><a href="../407-php-api-edycja/">← 407: edycja rekordu</a></p>
        <h1>PHP API — usuwanie oferty</h1>
        <p>Żądanie <code>DELETE</code> usuwa jeden rekord po jego ID.</p>
    </header>

    <main>
        <section aria-labelledby="delete-heading">
            <h2 id="delete-heading">Usuń rekord lokalny</h2>
            <p class="warning">
                To ćwiczenie usuwa dane z lokalnej bazy. Pracuj na kopii i nie
                uruchamiaj go na produkcyjnej bazie.
            </p>
            <form id="delete-form">
                <div class="field">
                    <label for="id">ID oferty do usunięcia</label>
                    <input id="id" name="id" type="number" min="1" step="1" required>
                </div>
                <button type="submit">Usuń ofertę</button>
            </form>
        </section>

        <section aria-labelledby="result-heading">
            <h2 id="result-heading">Odpowiedź API</h2>
            <p id="status" role="status" aria-live="polite">Nie wysłano jeszcze żądania.</p>
            <pre id="result" aria-label="Odpowiedź JSON"></pre>
        </section>
    </main>
</body>
</html>
