<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript — DOM i formularz</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <p>Ćwiczenie 11</p>
        <h1>Lista zadań sterowana przez JavaScript</h1>
    </header>

    <main>
        <form id="task-form">
            <label for="task-title">Nazwa zadania</label>
            <input id="task-title" name="title" autocomplete="off" required>

            <label for="task-priority">Priorytet</label>
            <select id="task-priority" name="priority">
                <option value="zwykły">Zwykły</option>
                <option value="ważny">Ważny</option>
            </select>

            <button type="submit">Dodaj zadanie</button>
        </form>

        <p id="status" role="status" aria-live="polite">Lista jest pusta.</p>
        <ul id="task-list" aria-label="Dodane zadania"></ul>
    </main>
</body>
</html>
