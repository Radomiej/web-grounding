<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML od podstaw</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>HTML opisuje strukturę strony</h1>
        <p>Przeglądarka czyta znaczniki i buduje z nich dokument.</p>
    </header>

    <main>
        <section aria-labelledby="najwazniejsze-elementy">
            <h2 id="najwazniejsze-elementy">Najważniejsze elementy</h2>
            <ul>
                <li><code>&lt;h1&gt;</code> — główny nagłówek</li>
                <li><code>&lt;p&gt;</code> — akapit tekstu</li>
                <li><code>&lt;a&gt;</code> — odnośnik</li>
                <li><code>&lt;ul&gt;</code> i <code>&lt;li&gt;</code> — lista</li>
            </ul>
            <a href="../02-html-formularz/">Przejdź do formularza HTML</a>
        </section>
    </main>

    <footer>
        <p>Ćwiczenie 1 — web-grounding</p>
    </footer>
</body>
</html>
