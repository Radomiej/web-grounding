<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz i tabela HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formularz i tabela</h1>
    </header>

    <main>
        <section aria-labelledby="plan-zajec">
            <h2 id="plan-zajec">Plan zajęć</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th scope="col">Temat</th><th scope="col">Czas</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>HTML</td><td>45 minut</td></tr>
                        <tr><td>PHP</td><td>90 minut</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section aria-labelledby="zapis">
            <h2 id="zapis">Zapis na zajęcia</h2>
            <form action="#" method="get">
                <label for="student-name">Imię</label>
                <input id="student-name" name="name" required>

                <label for="topic">Wybierz temat</label>
                <select id="topic" name="topic">
                    <option value="html">HTML</option>
                    <option value="php">PHP</option>
                </select>

                <button type="submit">Zapisz</button>
            </form>
        </section>
    </main>

    <footer><p>Ćwiczenie 2 — dane formularza obsłużymy później w PHP.</p></footer>
</body>
</html>
